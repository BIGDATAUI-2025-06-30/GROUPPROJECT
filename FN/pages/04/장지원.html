<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .bg {
            position: relative;
            width: 100%;
            height: auto;
        }

        .top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: flex-start;

        }

        .t1 {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 90px;
            max-width: 1120px;
            margin: 0 auto;
            font-size: 13px;
            display: flex;
            align-items: center;
        }

        .t1>a {
            font-weight: 500;
        }

        .t1>span {
            padding: 10px;
            font-weight: 500;
        }

        .t1>.sp_b {
            font-weight: bold;
        }

        .t1>span::before {
            content: " >";
            margin-right: 8px;
            display: inline-block;
            width: 6px;
            height: 12px;
        }

        .t1>span>sp_b::before {
            content: " >";
            display: inline-block;
            width: 6px;
            height: 12px;
        }

        .bl_mem {
            align-items: center;

        }
    </style>
</head>

<body>
    <main>
        <div class="bg">
            <img src="./image/1.avif" alt="">
            <div class="top">
                <div class="t1">
                    <a href="">홈</a>
                    <span>서비스/멤버십</span>
                    <span>블루멤버스</span>
                    <span>Hyundai Mobility카드</span>
                    <span class="sp_b">재발급 신청안내</span>
                </div>
                <!-- <div class="bl_mem">
                    <h1>재발급 신청안내</h1>
                    <p>블루멤버스 비신용 카드 분실시 재발급을 도와드립니다.</p>
                </div> -->
            </div>
        </div>
    </main>
</body>

</html>
