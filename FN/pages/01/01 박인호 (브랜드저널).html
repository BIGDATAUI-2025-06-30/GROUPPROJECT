<!DOCTYPE html>
<html lang="ko">

<head>

    <title> Hyundai 브랜드 저널 </title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .spread-img {
            position: relative;
            background-image: url('https://www.hyundai.com/content/dam/hyundai/kr/ko/images/brand/brandstory/campaigns/campaigns-campaigns-keyvisual-w.jpg');
            background-size: cover;
            background-position: center;
            height: 500px;

        }

        h1,
        h3 {
            position: absolute;
        }

        .mid {
            display: flex;
            margin: 0;
            padding: 0;
        }

        .mid-menu {
            padding: 20px;
            border: 1px solid;
            background-color: rgb(58, 58, 70);
            color: white;
        }
    </style>
</head>

<body>
    <header>
    </header>

    <main>

        <section class="spread-img">
            <img src="https://www.hyundai.com/content/dam/hyundai/kr/ko/images/brand/brandstory/campaigns/campaigns-campaigns-keyvisual-w.jpg"
                alt="">
            <h1>브랜드 저널</h1>
            <h3>개인의 이동 수단에서 지속 가능한 미래로의 연결을 추구해온 현대자동차의 브랜드 캠페인을 소개합니다.</h3>
        </section>
        <section class="mid">
            <div class="mid-menu">라이프스타일</div>
            <div class="mid-menu">모빌리티 솔루션</div>
            <div class="mid-menu">지속가능한 비전</div>
            <div class="mid-menu">아이오닉</div>
            <div class="mid-menu">헤리티지 스토리</div>
        </section>

        <!-- 캠페인 섹션 -->
        <section class="campaigns">
            <!-- 캠페인 그리드 -->
        </section>

    </main>

    <!-- 푸터 -->

        <!-- 푸터 내용 -->
    </footer>

</html>
