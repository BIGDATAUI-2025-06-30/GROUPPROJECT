<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블루핸즈 가망점 개설 안내</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Noto Sans KR", sans-serif;
            background-color: #fff;
            color: #000;
        }

        .Top-Warpper {
            background-color: #E4DCD1;
        }

        .Top-Warpper>header {
            height: 270px;
            /* display: table-cell; */
            text-align: center;
            background: #f4f0eb;
            margin-left: 45px;
            margin-right: 45px;
            padding: 40px 0 10px;

            background: #f4f0eb;
            padding: 36px 90px;
            vertical-align: middle;
        }

        .breadcrumb a {
            color: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            /* height: 100%; */
        }

        .breadcrumb {
            display: flex;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 90px;
            max-width: 1120px;

            margin: 0 auto;
            /* background: #e6ded2; */
            padding: 10px 20px;
            font-size: 13px;
            color: #000;
        }

        .breadcrumb span {

            position: relative;
            padding: 0 0 0 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .breadcrumb span:first-child {
            padding-left: 0;
        }

        .breadcrumb span:not(:first-child)::before {
            content: '\003e';
            /* '>' 문자 */
            position: absolute;
            left: 0;
            color: #777;
        }



        .Top-Warpper>header>h1 {
            font-size: 56px;
            padding-bottom: 18px;
            font-family: 'HeadMedium';
        margin: 0.67em 0;
        }

        .Top-Warpper>header>p {

            color: #000;
            font-weight: normal;


        }

        
        .tab-menu {
            height: 60px;
            width: 100%;
            max-width: 1920px;
            border: 1px solid;
            display: flex;
            background-color: #444444;
           
        }

        .tab-menu>a {
            display: inline-flex;
            height: 100%;
            width: 100%;
            padding: 0 15px;
            font-family: 'TextMedium';
            font-size: 15px;
            /* line-height: 22px; */
            color: #fff;
            cursor: pointer;
            text-align: center;
            justify-content: center;



        }

        .tab-menu>a>span {
            display: inline-block;






        }

        /* .tab-menu .active {
            display: inline-block;
            vertical-align: middle;
        } */

        main {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
        }

        main h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .steps-container {
            background: #f7f7f7;
            padding: 30px;
            border-radius: 8px;
        }

        .icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .icons div {
            flex: 1;
        }

        .icons div img {
            height: 40px;
            margin-bottom: 10px;
        }

        .icons div p {
            font-size: 14px;
        }

        .explanation {
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
            color: #222;
        }

        .steps-bottom {
            display: flex;
            justify-content: space-around;
            font-size: 14px;
            font-weight: bold;
            color: #0078d4;
        }
    </style>
</head>

<body>
    <div class="Top-Warpper">
        <div class="breadcrumb">
            <a href="">홈</a>
            <span>서비스/멤버십</span>
            <span>블루핸즈 가맹사업</span>
            <span>가맹점 개설 안내</span>
            <span>개설 절차</span>
        </div>

        <header>
            <h1>블루핸즈 가맹점 개설 안내</h1>
            <p>블루핸즈 개설 관련 정보를 안내드립니다.</p>
        </header>
    </div>
    <div class="tab-menu">
        <a href=""><span>개설 절차</span></a>
        <a href=""><span>개설 비용</span></a>
        <a href=""><span>지원 혜택</span></a>




    </div>

    <main>
        <h2>개설 절차</h2>
        <div class="steps-container">
            <div class="icons">
                <div>
                    <img src="https://img.icons8.com/ios/50/clipboard.png" alt="">
                    <p>블루핸즈 공모</p>
                </div>
                <div>
                    <img src="https://img.icons8.com/ios/50/document.png" alt="">
                    <p>내인가</p>
                </div>
                <div>
                    <img src="https://img.icons8.com/ios/50/stack-of-paper.png" alt="">
                    <p>본인가</p>
                </div>
                <div>
                    <img src="https://img.icons8.com/ios/50/agreement.png" alt="">
                    <p>가망계약 체결</p>
                </div>
            </div>

            <div class="explanation">
                블루핸즈 가맹점은 공모를 통해 모집합니다.<br>
                서류 심사 및 면접을 거쳐 선정된 가망희망자에게는 후속 절차를 안내합니다.
            </div>

            <div class="steps-bottom">
                <div>1 블루햄즈 공모</div>
                <div>2 신청서 접수</div>
                <div>3 서류 심사 및 면접</div>
                <div>4 후수역무 안내</div>
            </div>
        </div>
    </main>
</body>

</html>
