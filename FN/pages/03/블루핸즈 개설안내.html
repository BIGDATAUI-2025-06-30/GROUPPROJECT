<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블루핸즈 가망점 개설 안내</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Noto Sans KR", sans-serif;
            background-color: #fff;
            color: #000;
        }

        .Top-Warpper {
            background-color: #E4DCD1;
        }

        .Top-Warpper>header {
            height: 270px;

            text-align: center;
            background: #f4f0eb;
            margin-left: 45px;
            margin-right: 45px;
            padding: 40px 0 10px;

            background: #f4f0eb;
            padding: 36px 90px;
            vertical-align: middle;
        }

        .breadcrumb a {
            color: inherit;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            /* height: 100%; */
        }

        .breadcrumb {
            display: flex;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 90px;
            max-width: 1120px;

            margin: 0 auto;
            /* background: #e6ded2; */
            padding: 10px 20px;
            font-size: 13px;
            color: #000;
        }

        .breadcrumb span {

            position: relative;
            padding: 0 0 0 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .breadcrumb span:first-child {
            padding-left: 0;
        }

        .breadcrumb span:not(:first-child)::before {
            content: '\003e';
            /* '>' 문자 */
            position: absolute;
            left: 0;
            color: #777;
        }



        .Top-Warpper>header>h1 {
            font-size: 56px;
            padding-bottom: 18px;
            font-family: 'HeadMedium';
            margin: 0.67em 0;
        }

        .Top-Warpper>header>p {

            color: #000;
            font-weight: normal;


        }


        .tab-menu {
            height: 60px;
            /* width: 100%; */
            width: 100%;
            border: 1px solid;
            display: flex;
            background-color: #444444;


        }

        .tab-menu>a {
            text-decoration: none;
            display: inline-flex;
            height: 100%;
            width: 100%;
            padding: 0 15px;
            font-family: 'TextMedium';
            font-size: 15px;
            line-height: 60px;
            color: #fff;
            cursor: pointer;
            text-align: center;
            justify-content: center;


        }


        .tab-menu>a>span:first-child {
            padding-left: 0;
        }

        .tab-menu>a>span:not(:first-child)::before {
            content: '\003e';
            /* '>' 문자 */
            position: absolute;
            left: 0;
            color: #777;

        }










        /* .tab-menu .active {
            display: inline-block;
            vertical-align: middle;
        } */

        main {

            max-width: 1120px;
            margin: 60px auto;
            padding: 0 20px;
        }

        main h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .steps-container {
            height: 439px;
            width: 100%;
            background: #F8F5F4;
            padding: 37px 0 0;

        }

        .icons {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .icons div {
            flex: 1;
        }

        .icons div img {
            height: 63px;
            width: 63px;
            margin-bottom: 10px;

        }

        .icons div p {
            font-size: 16px;
        }

        .icons-sub {
            height: 286px;
            padding: 73px 0 40px;
            border-top: 1px solid #e5e5e5;


        }

        .explanation {
            height: 60px;
            text-align: center;
            font-size: 14px;
            /* margin-bottom: 30px; */
            color: #222;
        }

        .steps-bottom {
            display: flex;
            height: 32px;

            line-height: 32px;
            font-size: 18px;
            font-weight: bold;
            color: #0078d4;
        }

        .steps-bottom>div>li {
            display: flex;
            font-size: 18px;
        }

        .steps-bottom>div>li .num {
            border: 1px solid;
            width: 32px;
            height: 32px;
            line-height: 32px;
            margin-right: 11px;
            border-radius: 50%;
            background-color: #007fa8;
            color: #fff;
            text-align: center;
        }

        .steps-bottom>div>li::before {
            display: block;
            content: "";
            width: 60px;
            height: 1px;
            margin: 15px 20px 0;
            background: #ccc;
        }

        .steps-bottom div .txt {
            color: black;
        }

        .arrow-container-wrapper {
            width: 100%;
           display: flex;
            justify-content: center;
        }

        .arrow-container-wrapper .arrow-container {
            height: 69px;
            width: 100%;
            /* max-width: 1120px; */
            margin: 0 auto;
            background-color: #e4dcd3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 70px;
            margin-bottom: 70px;
            overflow: hidden;
            color: #000;
            font-size: 30px;
            padding: 64px 0;

        }

        .arrow-text {
            font-size: 20px;
            font-weight: bold;
            position: relative;
        }

        .arrow-text.left::before {
            content: "〈";
            /* 왼쪽 화살표 */
            margin-right: 10px;
        }

        .arrow-text.right::after {
            content: "〉";
            /* 오른쪽 화살표 */
            margin-left: 10px;
        }
    </style>
</head>

<body>

    </div>
    <div class="tab-menu">

                <div class="steps-botton ">

                        <li>

                        <div>
                            <li>

                    </div>

                </div>






            </div>
            <div class="arrow-container-wrapper">
                <div class="arrow-container">

    </main>
